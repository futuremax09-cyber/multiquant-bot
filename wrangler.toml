name = "multiquant-bot"
main = "worker.js"
compatibility_date = "2026-09-30"
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
BOT_USERNAME = "multiquantacademybot"
CHANNEL_USERNAME = "@multiquantacademy"
CHANNEL_CHAT_ID = "@multiquantacademy"
TEAM_ALERT_CHAT_ID = "-5218515529"

GEMINI_MODEL = "gemini-3.1-flash-lite"

SIGNAL_SCAN_INTERVAL_MINUTES = "15"
SIGNAL_MAX_24H = "30"
SIGNAL_MIN_GAP_MINUTES = "25"

OKX_WS_URL = "wss://ws.okx.com/ws/v5/business"

[[d1_databases]]
binding = "DB"
database_name = "multiquant-db"
database_id = "f4070bcf-0584-4c57-8fcd-19ec5cf7d5e2"

[[durable_objects.bindings]]
name = "OKX_MONITOR"
class_name = "OkxMonitorDO"

[exports.OkxMonitorDO]
type = "sqlite"

[triggers]
crons = ["*/5 * * * *"]
